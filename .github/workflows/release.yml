name: Build release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"  # Anki 25.07+ bundles Python 3.13

      - name: Run tests
        run: python -m unittest discover -s tests

      - name: Check release version
        run: |
          python - <<'PY'
          import os
          from contextual_review.release import VERSION
          assert os.environ["GITHUB_REF_NAME"] == "v" + VERSION, "Tag must match the add-on version"
          PY

      - name: Run smoke review
        run: python scripts/smoke_review_loop.py

      - name: Build add-on package
        run: python scripts/package_addon.py --no-build-dir

      - name: Extract release notes
        run: |
          python - <<'PY'
          import os
          import re
          version = os.environ["GITHUB_REF_NAME"].removeprefix("v")
          changelog = open("CHANGELOG.md", encoding="utf-8").read()
          section = re.search(
              r"^## %s\n(.*?)(?=^## |\Z)" % re.escape(version), changelog, re.M | re.S
          )
          assert section, "CHANGELOG.md has no section for " + version
          with open("release-notes.md", "w", encoding="utf-8") as notes:
              notes.write(section.group(1).strip() + "\n")
          PY

      - name: Create GitHub release
        run: gh release create "$GITHUB_REF_NAME" dist/contextual_review_addon.ankiaddon --notes-file release-notes.md --title "Contextual Spaced Repetition $GITHUB_REF_NAME"
        env:
          GH_TOKEN: ${{ github.token }}
